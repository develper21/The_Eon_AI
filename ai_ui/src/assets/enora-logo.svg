<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="55" fill="url(#bgGradient)" stroke="url(#textGradient)" stroke-width="2"/>
  
  <!-- Inner decorative circle -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#textGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- E letter stylized -->
  <path d="M 35 35 L 35 85 L 45 85 L 45 60 L 55 60 L 55 50 L 45 50 L 45 35 Z" fill="url(#textGradient)"/>
  
  <!-- Enora text -->
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="url(#textGradient)" text-anchor="middle">ENORA</text>
  
  <!-- The Eon text -->
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="6" fill="url(#textGradient)" text-anchor="middle" opacity="0.8">THE EON</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="2" fill="url(#textGradient)" opacity="0.6"/>
  <circle cx="90" cy="30" r="2" fill="url(#textGradient)" opacity="0.6"/>
  <circle cx="30" cy="90" r="2" fill="url(#textGradient)" opacity="0.6"/>
  <circle cx="90" cy="90" r="2" fill="url(#textGradient)" opacity="0.6"/>
  
  <!-- AI indicator -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="4" fill="url(#textGradient)" text-anchor="middle" opacity="0.7">AI</text>
</svg>
